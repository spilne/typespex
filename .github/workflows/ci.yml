name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Verify generated example
        run: bun run check:generated

      - name: Test
        run: bun test

  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.19.0, 22.12.0]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Import package exports with Node
        run: |
          for package in runtime emitter shim-bun shim-hono shim-node; do
            (cd "packages/$package" && node --input-type=module -e "await import('@typespex/$package')")
          done
          (cd packages/runtime && node --input-type=module -e "await import('@typespex/runtime/server')")

      - name: Exercise Node HTTP adapter
        run: node ./packages/shim-node/test/node-smoke.mjs
