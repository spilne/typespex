name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This advisory affects UUID v3/v5/v6 buffer writes. The locked UUID is
      # reached only by the private benchmark's hyperid dependency, which uses v4.
      - name: Audit dependencies
        run: bun run audit:dependencies

  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed packages in a clean consumer
        run: bun run check:packages

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Verify generated example
        run: bun run check:generated

      - name: Check TypeSpec HTTP conformance
        run: bun run check:conformance

      - name: Test
        run: bun run test

      - name: Check coverage
        run: bun run test:coverage

  typespec-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typespec-channel: [minimum, latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Resolve aligned TypeSpec release
        run: |
          version="$(node ./scripts/resolve-typespec-version.mjs "${{ matrix.typespec-channel }}")"
          streams_range="$(npm view "@typespec/http@$version" 'peerDependencies.@typespec/streams')"
          test -n "$streams_range"
          streams_version="$(
            npm view "@typespec/streams@$streams_range" version --json |
              node -e '
                const value = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
                const version = Array.isArray(value) ? value.at(-1) : value;
                if (typeof version !== "string" || version.length === 0) {
                  throw new Error("No @typespec/streams version satisfies the declared peer range.");
                }
                process.stdout.write(version);
              '
          )"
          printf 'TYPESPEC_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'TYPESPEC_STREAMS_VERSION=%s\n' "$streams_version" >> "$GITHUB_ENV"
          printf 'Testing TypeSpec %s and streams %s\n' "$version" "$streams_version"

      - name: Install aligned TypeSpec dependencies
        run: |
          bun add --cwd packages/http-emitter --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"
          bun add --cwd packages/compiler-core --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"
          bun add --cwd packages/mcp --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION"
          bun add --cwd packages/mcp-emitter --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION" \
            "@typespec/streams@$TYPESPEC_STREAMS_VERSION"
          bun add --cwd example --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"

          for directory in packages/http-emitter packages/compiler-core packages/mcp packages/mcp-emitter example; do
            actual="$(node -p "require('./$directory/node_modules/@typespec/compiler/package.json').version")"
            test "$actual" = "$TYPESPEC_VERSION"
          done
          for directory in packages/http-emitter packages/compiler-core packages/mcp-emitter example; do
            actual="$(node -p "require('./$directory/node_modules/@typespec/http/package.json').version")"
            test "$actual" = "$TYPESPEC_VERSION"
          done
          actual_streams="$(node -p "require('./packages/mcp-emitter/node_modules/@typespec/streams/package.json').version")"
          test "$actual_streams" = "$TYPESPEC_STREAMS_VERSION"

      - name: Build against selected TypeSpec release
        run: bun run build

      - name: Compile and typecheck the representative service
        run: |
          bun run generate:example
          bun run --filter typespex-example typecheck

  mcp-typespec-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typespec-channel: [minimum, latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Resolve aligned TypeSpec release
        run: |
          version="$(node ./scripts/resolve-typespec-version.mjs "${{ matrix.typespec-channel }}")"
          streams_range="$(npm view "@typespec/http@$version" 'peerDependencies.@typespec/streams')"
          test -n "$streams_range"
          streams_version="$(
            npm view "@typespec/streams@$streams_range" version --json |
              node -e '
                const value = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
                const version = Array.isArray(value) ? value.at(-1) : value;
                if (typeof version !== "string" || version.length === 0) {
                  throw new Error("No @typespec/streams version satisfies the declared peer range.");
                }
                process.stdout.write(version);
              '
          )"
          printf 'TYPESPEC_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'TYPESPEC_STREAMS_VERSION=%s\n' "$streams_version" >> "$GITHUB_ENV"
          printf 'Testing MCP generation with TypeSpec %s and streams %s\n' "$version" "$streams_version"

      - name: Install aligned MCP compiler dependencies
        run: |
          bun add --cwd packages/compiler-core --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION"
          bun add --cwd packages/mcp --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION"
          bun add --cwd packages/mcp-emitter --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION" \
            "@typespec/streams@$TYPESPEC_STREAMS_VERSION"
          bun add --cwd example --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"

          for directory in packages/compiler-core packages/mcp packages/mcp-emitter example; do
            actual="$(node -p "require('./$directory/node_modules/@typespec/compiler/package.json').version")"
            test "$actual" = "$TYPESPEC_VERSION"
          done
          actual_http="$(node -p "require('./packages/mcp-emitter/node_modules/@typespec/http/package.json').version")"
          actual_streams="$(node -p "require('./packages/mcp-emitter/node_modules/@typespec/streams/package.json').version")"
          test "$actual_http" = "$TYPESPEC_VERSION"
          test "$actual_streams" = "$TYPESPEC_STREAMS_VERSION"

      - name: Build against selected TypeSpec release
        run: bun run build

      - name: Compile and typecheck the MCP service
        run: |
          bun run generate:mcp-example
          bun run --filter typespex-example typecheck

  mcp-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run MCP 2026-07-28 conformance suite
        run: bun run check:mcp-conformance

      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-conformance-results
          path: .context/mcp-conformance-results

  node-types-compatibility:
    runs-on: ubuntu-latest
    env:
      NODE_TYPES_VERSION: "22.12.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install minimum Node type declarations
        run: |
          bun add --cwd packages/adapter-node --dev --exact --no-save \
            "@types/node@$NODE_TYPES_VERSION"

          actual="$(bun -p 'require("./packages/adapter-node/node_modules/@types/node/package.json").version')"
          test "$actual" = "$NODE_TYPES_VERSION"

      - name: Build against minimum Node type declarations
        run: bun run build

  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.12.0, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Import package exports with Node
        run: |
          for package in codec http-client compiler-core http-server mcp mcp-server mcp-http-bridge mcp-transport-http mcp-transport-stdio http-emitter mcp-emitter adapter-bun adapter-hono adapter-node adapter-express; do
            (cd "packages/$package" && node --input-type=module -e "await import('@typespex/$package')")
          done
          (cd packages/compiler-core && node --input-type=module -e "await import('@typespex/compiler-core/unstable')")

      - name: Exercise Node HTTP adapters
        run: |
          node ./packages/adapter-node/test/node-smoke.mjs
          node ./packages/adapter-express/test/express-smoke.mjs
