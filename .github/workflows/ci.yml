name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # This advisory affects UUID v3/v5/v6 buffer writes. The locked UUID is
      # reached only by the private benchmark's hyperid dependency, which uses v4.
      - name: Audit dependencies
        run: bun run audit:dependencies

  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed packages in a clean consumer
        run: bun run check:packages

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Verify generated example
        run: bun run check:generated

      - name: Check TypeSpec HTTP conformance
        run: bun run check:conformance

      - name: Test
        run: bun run test

      - name: Check coverage
        run: bun run test:coverage

  typespec-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typespec-channel: [minimum, latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Resolve aligned TypeSpec release
        run: |
          version="$(node ./scripts/resolve-typespec-version.mjs "${{ matrix.typespec-channel }}")"
          printf 'TYPESPEC_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'Testing TypeSpec %s\n' "$version"

      - name: Install aligned TypeSpec dependencies
        run: |
          bun add --cwd packages/emitter --dev --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"
          bun add --cwd example --exact \
            "@typespec/compiler@$TYPESPEC_VERSION" \
            "@typespec/http@$TYPESPEC_VERSION"

          for directory in packages/emitter example; do
            for dependency in compiler http; do
              actual="$(node -p "require('./$directory/node_modules/@typespec/$dependency/package.json').version")"
              test "$actual" = "$TYPESPEC_VERSION"
            done
          done

      - name: Build against selected TypeSpec release
        run: bun run build

      - name: Compile and typecheck the representative service
        run: |
          bun run generate:example
          bun run --filter typespex-example typecheck

  node-types-compatibility:
    runs-on: ubuntu-latest
    env:
      NODE_TYPES_VERSION: "22.12.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install minimum Node type declarations
        run: |
          bun add --cwd packages/shim-node --dev --exact --no-save \
            "@types/node@$NODE_TYPES_VERSION"

          actual="$(bun -p 'require("./packages/shim-node/node_modules/@types/node/package.json").version')"
          test "$actual" = "$NODE_TYPES_VERSION"

      - name: Build against minimum Node type declarations
        run: bun run build

  node-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.12.0, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Import package exports with Node
        run: |
          for package in runtime emitter shim-bun shim-hono shim-node shim-express; do
            (cd "packages/$package" && node --input-type=module -e "await import('@typespex/$package')")
          done
          (cd packages/runtime && node --input-type=module -e "await import('@typespex/runtime/server')")

      - name: Exercise runtime and Node HTTP adapters
        run: |
          node ./packages/shim-node/test/node-smoke.mjs
          node ./packages/shim-express/test/express-smoke.mjs
