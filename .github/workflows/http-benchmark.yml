name: HTTP runtime benchmark

on:
  pull_request:
    branches: [main, master]
    paths:
      - "packages/http-server/src/**"
      - "packages/adapter-bun/src/**"
      - "packages/codec/src/**"
      - "example/generated/pet-store/**"
      - "bench/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/http-benchmark.yml"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline branch, tag, or commit
        default: master
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: http-benchmark-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  compare-http:
    name: Compare HTTP runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'master' }}
          path: baseline
          persist-credentials: false

      - name: Verify the PR baseline is the merge parent
        if: github.event_name == 'pull_request'
        run: test "$(git -C candidate rev-parse HEAD^1)" = "$(git -C baseline rev-parse HEAD)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Build both revisions
        run: |
          for revision in baseline candidate; do
            (
              cd "$revision"
              bun install --frozen-lockfile
              bun run build
            )
          done

      - name: Compare HTTP throughput
        id: benchmark
        timeout-minutes: 20
        working-directory: candidate
        env:
          TYPESPEX_BENCH_BASELINE_ROOT: ${{ github.workspace }}/baseline
          TYPESPEX_BENCH_OUTPUT: ${{ github.workspace }}/http-benchmark.json
          TYPESPEX_BENCH_TRIALS: "5"
          TYPESPEX_BENCH_DURATION: "5"
          TYPESPEX_BENCH_WARMUP: "2"
          TYPESPEX_BENCH_SEED: http-runtime-comparison-v1
        run: bun run bench/bench.ts

      - name: Upload raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-runtime-comparison-attempt-${{ github.run_attempt }}
          path: http-benchmark.json
          if-no-files-found: ${{ steps.benchmark.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 14
